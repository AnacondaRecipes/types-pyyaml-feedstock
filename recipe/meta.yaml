{% set name = "types-PyYAML" %}
{% set version = "6.0.12.20250822" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/types-PyYAML/types_pyyaml-6.0.12.20250822.tar.gz
  sha256: 259f1d93079d335730a9db7cff2bcaf65d7e04b4a56b5927d49a612199b59413

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.3
  run:
    - python

test:
  imports:
    - types
  requires:
    - pip
  commands:
    - pip check
    - test -f $SP_DIR/yaml-stubs/__init__.pyi  # [unix]

about:
  home: https://github.com/python/typeshed
  summary: Typing stubs for PyYAML
  license: Apache-2.0 AND MIT
  license_file: LICENSE
  license_family: OTHER
  description: |
    This is a PEP 561 type stub package for the PyYaml package.
    It can be used by type-checking tools like mypy, pyright, pytype,
    PyCharm, etc. to check code that uses PyYaml.
  dev_url: https://github.com/python/typeshed
  doc_url: https://pyyaml.org/wiki/PyYAMLDocumentation

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
